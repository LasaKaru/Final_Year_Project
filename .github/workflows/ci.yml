name: ci
on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore & build tool
        run: |
          dotnet restore BolaLens.sln
          dotnet build BolaLens.sln -c Release --no-restore
      - name: Build fixtures (integration tests load them with MSBuildWorkspace)
        run: |
          dotnet build fixtures/BolaLab/BolaLab.sln -c Release
          dotnet build fixtures/Calibration/Calibration.sln -c Release
      - name: Test (model-dependent tests are skipped in CI)
        run: dotnet test BolaLens.sln -c Release --no-build --filter "Category!=RequiresModel"
      - name: Symbolic scan of BolaLab (smoke)
        run: dotnet run --project src/BolaLens.Cli -c Release --no-build -- scan fixtures/BolaLab/BolaLab.sln --mode symbolic --out bolalab-report.json --no-fail
      - name: Evaluate against expected labels
        run: dotnet run --project src/BolaLens.Cli -c Release --no-build -- eval --report bolalab-report.json --labels fixtures/BolaLab/expected.json --out bolalab-metrics.md
      - uses: actions/upload-artifact@v4
        with:
          name: bolalab-report
          path: |
            bolalab-report.json
            bolalab-metrics.md
