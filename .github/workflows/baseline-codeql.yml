name: baseline-codeql
# Third evaluation configuration (baseline SAST): CodeQL C# security-extended on every dataset case at its pinned commit.
# Manual only. build-mode none: the analysed code is not built or executed. SARIF is kept as an artifact (never uploaded
# to this repository's code scanning). Evaluate locally:
#   bolalens eval --report <run>/report.json --labels <labels> --baseline-sarif csharp.sarif --baseline-name CodeQL --baseline-cwe 639 285 862 863
on:
  # manual runs need the workflow on the default branch; on dev, editing the request file starts a run
  push:
    branches: [ dev ]
    paths: [ 'eval/datasets/baseline-request.txt' ]
  workflow_dispatch:
    inputs:
      cases:
        description: Case IDs to analyse (comma-separated, empty = all in eval/datasets/cases.json)
        default: ''

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          WANT: ${{ inputs.cases || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          want = {c.strip() for c in os.environ.get("WANT", "").split(",") if c.strip()}
          rows = []
          for c in json.load(open("eval/datasets/cases.json"))["cases"]:
              if want and c["caseId"] not in want: continue
              repo = c["repo"].removeprefix("https://github.com/").removesuffix(".git")
              for variant, sha in c["variants"].items():
                  rows.append({"case": c["caseId"], "variant": variant, "repo": repo, "sha": sha})
          print("include=" + json.dumps(rows))
          PY

  codeql:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: target
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          source-root: target
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: baseline-${{ matrix.case }}-${{ matrix.variant }}
          upload: never
          output: sarif
      - name: Record versions
        run: |
          ls sarif
          echo "case=${{ matrix.case }} variant=${{ matrix.variant }} repo=${{ matrix.repo }} sha=${{ matrix.sha }}" > sarif/env.txt
          python3 -c "import json,glob;d=json.load(open(glob.glob('sarif/*.sarif')[0]));print('codeql', d['runs'][0]['tool']['driver'].get('semanticVersion'))" >> sarif/env.txt
      - name: Print compact results (retrievable through the job log)
        env:
          CASE: ${{ matrix.case }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re
          d = json.load(open(glob.glob('sarif/*.sarif')[0]))
          for run in d['runs']:
              tool = run['tool']
              cwes = {}
              for comp in [tool.get('driver', {})] + tool.get('extensions', []):
                  for r in comp.get('rules', []):
                      tags = (r.get('properties') or {}).get('tags', [])
                      cwes[r['id']] = sorted({m.group(1).lstrip('0') for t in tags for m in [re.search(r'cwe[-/](\d+)$', t, re.I)] if m})
              for res in run.get('results', []):
                  rule = res.get('ruleId') or (res.get('rule') or {}).get('id', '')
                  for loc in res.get('locations', [])[:1]:
                      pl = loc.get('physicalLocation', {})
                      print('BASELINE ' + json.dumps({'case': os.environ['CASE'], 'variant': os.environ['VARIANT'], 'rule': rule,
                            'cwes': cwes.get(rule, []), 'uri': pl.get('artifactLocation', {}).get('uri', ''),
                            'line': pl.get('region', {}).get('startLine', 0)}, separators=(',', ':')))
          print('BASELINE-END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.case }}-${{ matrix.variant }}
          path: sarif/
